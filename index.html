    <main id="materias" class="materias" aria-live="polite">
      <noscript><p class="aviso">Activa JavaScript para ver las materias.</p></noscript>
    </main>

    <section id="descargas" class="descargas" hidden>
      <h2>Apps para descargar</h2>
      <div id="descargas-lista"></div>
    </section>

    <p class="pie">Toca una actividad para empezar.</p>
  </div>

  <script src="activities.js"></script>
  <script>
    (function () {
      var NS = "http://www.w3.org/2000/svg";
      var root = document.getElementById("materias");
      var motivos = {
        ciencias: "ciencias",
        science: "ciencias",
        matematicas: "matematicas",
        ingles: "ingles",
        lenguaje: "lenguaje",
        "estudios-sociales": "estudios-sociales",
        "social-studies": "estudios-sociales"
      };

      function aviso(texto) {
        var p = document.createElement("p");
        p.className = "aviso";
        p.textContent = texto;
        root.appendChild(p);
      }

      function motivo(id) {
        var svg = document.createElementNS(NS, "svg");
        svg.setAttribute("class", "motivo");
        svg.setAttribute("viewBox", "0 0 64 64");
        svg.setAttribute("aria-hidden", "true");
        var use = document.createElementNS(NS, "use");
        var clave = motivos[id] || "estrella";
        use.setAttribute("href", "#motivo-" + clave);
        svg.appendChild(use);
        return svg;
      }

      function render() {
        if (!Array.isArray(window.ESCUELA_ACTIVITIES)) {
          aviso("No se pudieron cargar las materias.");
          return;
        }

        window.ESCUELA_ACTIVITIES.forEach(function (materia) {
          var section = document.createElement("section");
          section.className = "materia";
          if (materia.id) section.id = materia.id;
          if (materia.color) section.style.setProperty("--color", materia.color);
          if (materia.tint) section.style.setProperty("--tint", materia.tint);
          if (materia.shadow) section.style.setProperty("--shadow", materia.shadow);

          var cabeza = document.createElement("div");
          cabeza.className = "materia-cabeza";
          cabeza.appendChild(motivo(materia.id));

          var titulo = document.createElement("h2");
          titulo.textContent = materia.name || "Materia";
          cabeza.appendChild(titulo);
          section.appendChild(cabeza);

          var actividades = Array.isArray(materia.activities) ? materia.activities : [];
          if (actividades.length === 0) {
            var pronto = document.createElement("p");
            pronto.className = "pronto";
            pronto.textContent = "Próximamente";
            section.appendChild(pronto);
          } else {
            actividades.forEach(function (actividad) {
              if (!actividad || !actividad.title || !actividad.href) return;
              var enlace = document.createElement("a");
              enlace.className = "actividad";
              enlace.href = actividad.href;
              if (/^https?:\/\//i.test(actividad.href)) {
                enlace.target = "_blank";
                enlace.rel = "noopener noreferrer";
              }

              var texto = document.createElement("span");
              var nombre = document.createElement("span");
              nombre.className = "actividad-titulo";
              nombre.textContent = actividad.title;
              texto.appendChild(nombre);

              if (actividad.detail) {
                var detalle = document.createElement("span");
                detalle.className = "actividad-detalle";
                detalle.textContent = actividad.detail;
                texto.appendChild(detalle);
              }

              var flecha = document.createElement("span");
              flecha.className = "flecha";
              flecha.setAttribute("aria-hidden", "true");
              flecha.textContent = "›";

              enlace.appendChild(texto);
              enlace.appendChild(flecha);
              section.appendChild(enlace);
            });
          }

          root.appendChild(section);
        });
      }

      function renderApps() {
        var section = document.getElementById("descargas");
        var lista = document.getElementById("descargas-lista");
        var apps = window.ESCUELA_APPS;
        if (!section || !lista || !Array.isArray(apps)) return;

        apps.forEach(function (app) {
          if (!app || !app.title || !app.href) return;

          var tarjeta = document.createElement("article");
          tarjeta.className = "descarga";

          var titulo = document.createElement("h3");
          titulo.className = "descarga-titulo";
          titulo.textContent = app.title;
          tarjeta.appendChild(titulo);

          if (app.detail) {
            var detalle = document.createElement("p");
            detalle.className = "descarga-detalle";
            detalle.textContent = app.detail;
            tarjeta.appendChild(detalle);
          }

          if (app.note) {
            var nota = document.createElement("p");
            nota.className = "descarga-nota";
            nota.textContent = app.note;
            tarjeta.appendChild(nota);
          }

          var enlace = document.createElement("a");
          enlace.className = "descarga-boton";
          enlace.href = app.href;
          if (app.download) enlace.setAttribute("download", app.download);
          enlace.textContent = "Descargar";
          tarjeta.appendChild(enlace);

          lista.appendChild(tarjeta);
        });

        if (lista.children.length > 0) section.hidden = false;
      }

      try {
        render();
      } catch (error) {
        aviso("No se pudieron cargar las materias.");
      }

      try {
        renderApps();
      } catch (error) {
        aviso("No se pudieron cargar las aplicaciones.");
      }

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(function () {});
      }
    })();
  </script>
