<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Science Practice Quiz</title><link rel="stylesheet" href="../actividad.css"></head><body style="margin:0;background:#f4f7fb">
<nav class="portal-volver" aria-label="Inicio"><a href="../index.html"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 64 64" aria-hidden="true"><polygon points="36,4 14,36 30,36 22,60 54,26 36,28" fill="#c8922a"/></svg>← Volver al inicio</a></nav>

<div id="science-quiz">
  <style>
    #science-quiz {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
      color: #24344d;
      box-sizing: border-box;
    }
    #science-quiz * { box-sizing: border-box; }
    #science-quiz .panel {
      background: #fff;
      border: 1px solid #dce5f2;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 4px 16px #20305012;
    }
    #science-quiz h2 {
      text-align: center;
      color: #2059a6;
      margin: 0 0 8px;
    }
    #science-quiz .subtitle {
      text-align: center;
      color: #63748a;
      margin-bottom: 22px;
    }
    #science-quiz .progress {
      height: 10px;
      background: #e7edf7;
      border-radius: 20px;
      overflow: hidden;
      margin: 12px 0 24px;
    }
    #science-quiz .bar {
      height: 100%;
      background: #4385e6;
      width: 0%;
      transition: width .25s;
    }
    #science-quiz .category {
      color: #2762ad;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
    }
    #science-quiz .question {
      font-size: 21px;
      font-weight: bold;
      line-height: 1.4;
      margin: 18px 0;
    }
    #science-quiz .option {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      background: #f7faff;
      border: 2px solid #dce5f2;
      border-radius: 12px;
      text-align: left;
      font-size: 17px;
      color: #24344d;
      cursor: pointer;
    }
    #science-quiz .option:hover {
      border-color: #4385e6;
    }
    #science-quiz .correct {
      background: #e8f8ec;
      border-color: #29a45c;
    }
    #science-quiz .wrong {
      background: #fff0f0;
      border-color: #df5555;
    }
    #science-quiz .feedback {
      padding: 14px;
      border-radius: 12px;
      background: #f0f5ff;
      margin-top: 18px;
      line-height: 1.5;
    }
    #science-quiz .actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 22px;
    }
    #science-quiz .btn {
      border: none;
      background: #2869c5;
      color: white;
      padding: 13px 20px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }
    #science-quiz .btn:disabled {
      background: #aab8cb;
      cursor: default;
    }
    #science-quiz .secondary {
      background: #eaf0f8;
      color: #24344d;
    }
    #science-quiz .score {
      text-align: center;
      font-size: 48px;
      color: #2059a6;
      font-weight: bold;
      margin: 24px 0 10px;
    }
    #science-quiz .center { text-align: center; }
    #science-quiz .review-item {
      border-bottom: 1px solid #e5eaf2;
      padding: 12px 0;
      line-height: 1.5;
    }
    @media(max-width:480px) {
      #science-quiz { padding: 8px; }
      #science-quiz .panel { padding: 16px; }
      #science-quiz .question { font-size: 18px; }
      #science-quiz .option { font-size: 15px; }
    }
  </style>

  <div class="panel">
    <h2>Science Practice Quiz</h2>
    <div class="subtitle">
      Matter, Mass, Volume & States of Matter
    </div>
    <div id="quiz-content"></div>
  </div>
</div>

<script>
(function () {
  const questions = [
    {
      type: "Complete the sentence",
      q: "Everything around us is made of _____.",
      options: ["matter", "mass", "volume", "states"],
      answer: 0,
      explanation: "Everything around us is made of matter."
    },
    {
      type: "Complete the sentence",
      q: "_____ is the amount of matter in an object.",
      options: ["Matter", "Mass", "Volume", "States"],
      answer: 1,
      explanation: "Mass is the amount of matter in an object."
    },
    {
      type: "Complete the sentence",
      q: "_____ is the amount of space an object occupies.",
      options: ["Matter", "Mass", "Volume", "States"],
      answer: 2,
      explanation: "Volume is the space an object occupies."
    },
    {
      type: "Complete the sentence",
      q: "Solid, liquid and gas are the _____ of matter.",
      options: ["mass", "volume", "matter", "states"],
      answer: 3,
      explanation: "Solid, liquid and gas are states of matter."
    },
    {
      type: "True or False",
      q: "Matter has mass and volume.",
      options: ["True", "False"],
      answer: 0,
      explanation: "Matter has both mass and volume."
    },
    {
      type: "True or False",
      q: "Liquids have a fixed shape.",
      options: ["True", "False"],
      answer: 1,
      explanation: "Liquids take the shape of their container."
    },
    {
      type: "True or False",
      q: "Gases can spread out to fill a space.",
      options: ["True", "False"],
      answer: 0,
      explanation: "Gases fill the available space."
    },
    {
      type: "True or False",
      q: "We can change the state of matter by heating or cooling it.",
      options: ["True", "False"],
      answer: 0,
      explanation: "Heating and cooling can change the state of matter."
    },
    {
      type: "States of Matter",
      q: "What state of matter are ice cubes?",
      options: ["Solid", "Liquid", "Gas"],
      answer: 0,
      explanation: "Ice cubes are solids."
    },
    {
      type: "States of Matter",
      q: "What state of matter is water in a glass?",
      options: ["Solid", "Liquid", "Gas"],
      answer: 1,
      explanation: "Water in a glass is a liquid."
    },
    {
      type: "States of Matter",
      q: "What state of matter is water vapor?",
      options: ["Solid", "Liquid", "Gas"],
      answer: 2,
      explanation: "Water vapor is a gas."
    },
    {
      type: "True or False",
      q: "A solid has a fixed shape.",
      options: ["True", "False"],
      answer: 0,
      explanation: "A solid keeps its shape."
    },
    {
      type: "True or False",
      q: "Air is matter.",
      options: ["True", "False"],
      answer: 0,
      explanation: "Air has mass and occupies space."
    },
    {
      type: "States of Matter",
      q: "What happens to ice when it melts?",
      options: [
        "It becomes liquid water",
        "It becomes a solid",
        "It disappears"
      ],
      answer: 0,
      explanation: "Melting changes solid ice into liquid water."
    }
  ];

  let current = 0;
  let answers = {};

  const root = document.getElementById("quiz-content");

  function make(tag, text, className) {
    const el = document.createElement(tag);
    if (text !== undefined) el.textContent = text;
    if (className) el.className = className;
    return el;
  }

  function button(label, fn, secondary, disabled) {
    const b = make("button", label,
      "btn" + (secondary ? " secondary" : ""));
    b.type = "button";
    b.disabled = !!disabled;
    b.addEventListener("click", fn);
    return b;
  }

  function showQuestion() {
    root.replaceChildren();

    const q = questions[current];
    const selected = answers[current];

    root.appendChild(
      make("div",
        "Question " + (current + 1) +
        " of " + questions.length,
        "category")
    );

    const progress = make("div", undefined, "progress");
    const bar = make("div", undefined, "bar");
    bar.style.width =
      ((current + 1) / questions.length * 100) + "%";
    progress.appendChild(bar);
    root.appendChild(progress);

    root.appendChild(make("div", q.type, "category"));
    root.appendChild(make("div", q.q, "question"));

    if (q.type === "Complete the sentence") {
      root.appendChild(
        make("div",
          "Word bank: matter · mass · volume · states",
          "subtitle")
      );
    }

    q.options.forEach((option, index) => {
      const b = make("button", option, "option");
      b.type = "button";

      if (selected !== undefined) {
        b.disabled = true;
        if (index === q.answer) b.classList.add("correct");
        if (index === selected && index !== q.answer) {
          b.classList.add("wrong");
        }
      }

      b.addEventListener("click", () => {
        if (answers[current] !== undefined) return;
        answers[current] = index;
        showQuestion();
      });

      root.appendChild(b);
    });

    if (selected !== undefined) {
      const correct = selected === q.answer;
      root.appendChild(
        make("div",
          (correct ? "Correct! Great job! " :
                     "Not quite! ") + q.explanation,
          "feedback")
      );
    }

    const actions = make("div", undefined, "actions");

    actions.appendChild(
      button("Previous", () => {
        current--;
        showQuestion();
      }, true, current === 0)
    );

    actions.appendChild(
      button(
        current === questions.length - 1
          ? "Finish quiz"
          : "Next",
        () => {
          if (current === questions.length - 1) {
            showResults();
          } else {
            current++;
            showQuestion();
          }
        },
        false,
        selected === undefined
      )
    );

    root.appendChild(actions);
  }

  function showResults() {
    root.replaceChildren();

    let score = 0;
    questions.forEach((q, i) => {
      if (answers[i] === q.answer) score++;
    });

    root.appendChild(
      make("div", score + " / " + questions.length, "score")
    );

    let message = "Keep practicing!";
    if (score === questions.length) {
      message = "Excellent! Perfect score!";
    } else if (score >= 11) {
      message = "Great job!";
    } else if (score >= 8) {
      message = "Good effort!";
    }

    root.appendChild(
      make("h2", message, "center")
    );

    root.appendChild(
      make("p", "You completed your Science practice.",
        "center")
    );

    const actions = make("div", undefined, "actions");

    actions.appendChild(
      button("Review answers", showReview, true)
    );

    actions.appendChild(
      button("Try again", () => {
        current = 0;
        answers = {};
        showQuestion();
      })
    );

    root.appendChild(actions);
  }

  function showReview() {
    root.replaceChildren();

    root.appendChild(
      make("h2", "Review your answers")
    );

    questions.forEach((q, i) => {
      const correct = answers[i] === q.answer;
      const item = make("div", undefined, "review-item");

      item.appendChild(
        make("strong",
          (correct ? "✓ " : "✗ ") +
          (i + 1) + ". " + q.q)
      );

      item.appendChild(
        make("div",
          "Your answer: " + q.options[answers[i]])
      );

      item.appendChild(
        make("div",
          "Correct answer: " + q.options[q.answer])
      );

      root.appendChild(item);
    });

    const actions = make("div", undefined, "actions");

    actions.appendChild(
      button("Back to score", showResults, true)
    );

    actions.appendChild(
      button("Try again", () => {
        current = 0;
        answers = {};
        showQuestion();
      })
    );

    root.appendChild(actions);
  }

  showQuestion();
})();
</script>
</body></html>
