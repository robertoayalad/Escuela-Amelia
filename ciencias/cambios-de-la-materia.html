<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TALLER N.º 1. Cambios de la materia</title>
  <link rel="stylesheet" href="../actividad.css">
</head>
<body style="margin:0;background:#f4f7fb">
<nav class="portal-volver" aria-label="Inicio"><a href="../index.html"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 64 64" aria-hidden="true"><polygon points="36,4 14,36 30,36 22,60 54,26 36,28" fill="#c8922a"/></svg>← Volver al inicio</a></nav>

<div id="ciencias-quiz">
  <style>
    #ciencias-quiz {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
      color: #24344d;
      box-sizing: border-box;
    }
    #ciencias-quiz * { box-sizing: border-box; }
    #ciencias-quiz .panel {
      background: #fff;
      border: 1px solid #dce5f2;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 4px 16px #20305012;
    }
    #ciencias-quiz h2 {
      text-align: center;
      color: #2059a6;
      margin: 0 0 8px;
    }
    #ciencias-quiz .subtitle {
      text-align: center;
      color: #63748a;
      margin-bottom: 22px;
    }
    #ciencias-quiz .highlight {
      background: #fff6d8;
      border: 2px solid #e2b340;
      border-radius: 12px;
      padding: 14px 16px;
      margin: -6px 0 22px;
      line-height: 1.5;
      font-weight: bold;
      text-align: center;
      color: #3a2712;
    }
    #ciencias-quiz .progress {
      height: 10px;
      background: #e7edf7;
      border-radius: 20px;
      overflow: hidden;
      margin: 12px 0 24px;
    }
    #ciencias-quiz .bar {
      height: 100%;
      background: #4385e6;
      width: 0%;
      transition: width .25s;
    }
    #ciencias-quiz .category {
      color: #2762ad;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
    }
    #ciencias-quiz .question {
      font-size: 21px;
      font-weight: bold;
      line-height: 1.4;
      margin: 18px 0;
    }
    #ciencias-quiz .option {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      background: #f7faff;
      border: 2px solid #dce5f2;
      border-radius: 12px;
      text-align: left;
      font-size: 17px;
      font-family: inherit;
      line-height: 1.4;
      color: #24344d;
      cursor: pointer;
      touch-action: manipulation;
    }
    #ciencias-quiz .option:hover {
      border-color: #4385e6;
    }
    #ciencias-quiz .correct {
      background: #e8f8ec;
      border-color: #29a45c;
    }
    #ciencias-quiz .wrong {
      background: #fff0f0;
      border-color: #df5555;
    }
    #ciencias-quiz .feedback {
      padding: 14px;
      border-radius: 12px;
      background: #f0f5ff;
      margin-top: 18px;
      line-height: 1.5;
    }
    #ciencias-quiz .actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 22px;
    }
    #ciencias-quiz .btn {
      border: none;
      background: #2869c5;
      color: white;
      padding: 13px 20px;
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }
    #ciencias-quiz .btn:disabled {
      background: #aab8cb;
      cursor: default;
    }
    #ciencias-quiz .secondary {
      background: #eaf0f8;
      color: #24344d;
    }
    #ciencias-quiz .score {
      text-align: center;
      font-size: 48px;
      color: #2059a6;
      font-weight: bold;
      margin: 24px 0 10px;
    }
    #ciencias-quiz .center { text-align: center; }
    #ciencias-quiz .review-item {
      border-bottom: 1px solid #e5eaf2;
      padding: 12px 0;
      line-height: 1.5;
    }
    @media(max-width:480px) {
      #ciencias-quiz { padding: 8px; }
      #ciencias-quiz .panel { padding: 16px; }
      #ciencias-quiz .question { font-size: 18px; }
      #ciencias-quiz .option { font-size: 15px; }
    }
  </style>

  <div class="panel">
    <h2>TALLER N.º 1. Cambios de la materia</h2>
    <div class="subtitle">
      Lea detenidamente cada situación y escriba si corresponde a un cambio físico o químico de la materia.
    </div>
    <p class="highlight">Lo que decide no es si hay calor, sino si se forma una sustancia nueva.</p>
    <div id="quiz-content" aria-live="polite"></div>
  </div>
</div>

<script>
(function () {
  const clave = "Lo que decide no es si hay calor, sino si se forma una sustancia nueva.";

  const questions = [
    {
      type: "Situación",
      q: "Una fruta se descompone después de varios días.",
      options: ["FÍSICO", "QUÍMICO"],
      answer: 1,
      explanation: "Los microbios la transforman en sustancias nuevas; cambia el olor y el color, y ya no vuelve a ser fruta fresca."
    },
    {
      type: "Situación",
      q: "Se cocina un trozo de carne en una sartén.",
      options: ["FÍSICO", "QUÍMICO"],
      answer: 1,
      explanation: "El calor cambia las sustancias de la carne; cambian el color, el olor y el sabor, y no se puede «descocinar». " + clave
    },
    {
      type: "Situación",
      q: "Una vela se derrite al estar encendida.",
      options: ["FÍSICO", "QUÍMICO"],
      answer: 0,
      explanation: "La cera solo pasa de sólida a líquida y al enfriarse vuelve a ser cera sólida. Aquí hay calor y aun así es físico. (Ojo: lo que se quema en la mecha sí es un cambio químico, pero la pregunta habla de derretirse.) " + clave
    },
    {
      type: "Situación",
      q: "Una hoja seca se quema y se convierte en ceniza.",
      options: ["FÍSICO", "QUÍMICO"],
      answer: 1,
      explanation: "El fuego la transforma en ceniza, humo y gases, que son sustancias nuevas; la ceniza no puede volver a ser hoja."
    },
    {
      type: "Situación",
      q: "Se mezcla vinagre con bicarbonato de sodio y se producen burbujas.",
      options: ["FÍSICO", "QUÍMICO"],
      answer: 1,
      explanation: "Las burbujas son un gas nuevo (dióxido de carbono) que antes no estaba; aquí no hay calor y aun así es químico. " + clave
    },
    {
      type: "Situación",
      q: "El agua se congela y se convierte en hielo.",
      options: ["FÍSICO", "QUÍMICO"],
      answer: 0,
      explanation: "El hielo sigue siendo agua, solo cambió de estado (de líquido a sólido) y se puede derretir otra vez."
    },
    {
      type: "Situación",
      q: "Se aplasta una lata de aluminio.",
      options: ["FÍSICO", "QUÍMICO"],
      answer: 0,
      explanation: "Cambia solo la forma; sigue siendo aluminio."
    },
    {
      type: "Situación",
      q: "Una reja de hierro se oxida por la lluvia.",
      options: ["FÍSICO", "QUÍMICO"],
      answer: 1,
      explanation: "El hierro con el agua y el aire forma óxido, una sustancia nueva café rojiza; no hay calor y aun así es químico. " + clave
    },
    {
      type: "Situación",
      q: "Se mezcla azúcar con agua hasta que se disuelve.",
      options: ["FÍSICO", "QUÍMICO"],
      answer: 0,
      explanation: "El azúcar sigue ahí (el agua sabe dulce) y si se evapora el agua vuelve a aparecer; no se formó nada nuevo."
    },
    {
      type: "Situación",
      q: "Un vaso de vidrio se rompe al caer al suelo.",
      options: ["FÍSICO", "QUÍMICO"],
      answer: 0,
      explanation: "Los pedazos siguen siendo vidrio; solo cambiaron la forma y el tamaño."
    }
  ];

  let current = 0;
  let answers = {};

  const root = document.getElementById("quiz-content");

  function make(tag, text, className) {
    const el = document.createElement(tag);
    if (text !== undefined) el.textContent = text;
    if (className) el.className = className;
    return el;
  }

  function button(label, fn, secondary, disabled) {
    const b = make("button", label,
      "btn" + (secondary ? " secondary" : ""));
    b.type = "button";
    b.disabled = !!disabled;
    b.addEventListener("click", fn);
    return b;
  }

  function showQuestion() {
    root.replaceChildren();

    const q = questions[current];
    const selected = answers[current];

    root.appendChild(
      make("div",
        "Pregunta " + (current + 1) +
        " de " + questions.length,
        "category")
    );

    const progress = make("div", undefined, "progress");
    const bar = make("div", undefined, "bar");
    bar.style.width =
      ((current + 1) / questions.length * 100) + "%";
    progress.appendChild(bar);
    root.appendChild(progress);

    root.appendChild(make("div", q.type, "category"));
    root.appendChild(make("div", q.q, "question"));

    q.options.forEach((option, index) => {
      const b = make("button", option, "option");
      b.type = "button";

      if (selected !== undefined) {
        b.disabled = true;
        if (index === q.answer) b.classList.add("correct");
        if (index === selected && index !== q.answer) {
          b.classList.add("wrong");
        }
      }

      b.addEventListener("click", () => {
        if (answers[current] !== undefined) return;
        answers[current] = index;
        showQuestion();
      });

      root.appendChild(b);
    });

    if (selected !== undefined) {
      const correct = selected === q.answer;
      root.appendChild(
        make("div",
          (correct ? "¡Correcto! ¡Muy bien! " :
                     "¡Casi! ") + q.explanation,
          "feedback")
      );
    }

    const actions = make("div", undefined, "actions");

    actions.appendChild(
      button("Anterior", () => {
        current--;
        showQuestion();
      }, true, current === 0)
    );

    actions.appendChild(
      button(
        current === questions.length - 1
          ? "Ver mi puntaje"
          : "Siguiente",
        () => {
          if (current === questions.length - 1) {
            showResults();
          } else {
            current++;
            showQuestion();
          }
        },
        false,
        selected === undefined
      )
    );

    root.appendChild(actions);
  }

  function showResults() {
    root.replaceChildren();

    let score = 0;
    questions.forEach((q, i) => {
      if (answers[i] === q.answer) score++;
    });

    root.appendChild(
      make("div", score + " / " + questions.length, "score")
    );

    let message = "¡Sigue practicando!";
    if (score === questions.length) {
      message = "¡Excelente! ¡Puntaje perfecto!";
    } else if (score >= 8) {
      message = "¡Muy bien!";
    } else if (score >= 6) {
      message = "¡Buen esfuerzo!";
    }

    root.appendChild(
      make("h2", message, "center")
    );

    root.appendChild(
      make("p", "Terminaste el taller de cambios de la materia.",
        "center")
    );

    const actions = make("div", undefined, "actions");

    actions.appendChild(
      button("Revisar respuestas", showReview, true)
    );

    actions.appendChild(
      button("Intentar de nuevo", () => {
        current = 0;
        answers = {};
        showQuestion();
      })
    );

    root.appendChild(actions);
  }

  function showReview() {
    root.replaceChildren();

    root.appendChild(
      make("h2", "Revisa tus respuestas")
    );

    questions.forEach((q, i) => {
      const correct = answers[i] === q.answer;
      const item = make("div", undefined, "review-item");

      item.appendChild(
        make("strong",
          (correct ? "✓ " : "✗ ") +
          (i + 1) + ". " + q.q)
      );

      item.appendChild(
        make("div",
          "Tu respuesta: " + q.options[answers[i]])
      );

      item.appendChild(
        make("div",
          "Respuesta correcta: " + q.options[q.answer])
      );

      root.appendChild(item);
    });

    const actions = make("div", undefined, "actions");

    actions.appendChild(
      button("Volver al puntaje", showResults, true)
    );

    actions.appendChild(
      button("Intentar de nuevo", () => {
        current = 0;
        answers = {};
        showQuestion();
      })
    );

    root.appendChild(actions);
  }

  showQuestion();
})();
</script>
</body>
</html>
